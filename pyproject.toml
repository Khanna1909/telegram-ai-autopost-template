[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-ai-autopost"
version = "1.0.0"
description = "A safe GitHub Actions template for AI-generated Telegram posts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Khanna Imani" }]
dependencies = [
  "Pillow>=10.4,<12",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
telegram-ai-autopost = "telegram_ai_autopost.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

